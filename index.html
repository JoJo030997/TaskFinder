<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TaskFinder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#101014;--paper:#f5f3ef;--cream:#eae7e0;--accent:#c0452a;--accent2:#2963c8;--muted:#78756e;--border:#d6d1c9;--card:#fff;--sbg:#e8f5ec;--stx:#1a7a3a;--pbg:#e8eef8;--ptx:#1a4a7a;--wbg:#fff4e8;--wtx:#b06a00;--shadow:0 2px 12px rgba(0,0,0,.07)}
body{font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}

header{background:var(--ink);padding:1.4rem 1.5rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-80px;right:-60px;width:240px;height:240px;border-radius:50%;background:var(--accent);opacity:.12}
.h-inner{max-width:960px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:#fff;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.tagline{font-size:.78rem;color:#a09888;margin-top:2px}
.gear-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.gear-btn:hover{background:rgba(255,255,255,.2)}

/* OVERLAY / SETTINGS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.s-panel{background:var(--card);border-radius:14px;width:100%;max-width:580px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.s-header{padding:1.5rem 1.8rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.s-title{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.s-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.s-body{overflow-y:auto;flex:1;padding:1.2rem 1.8rem 1.8rem}
.s-sec{margin-bottom:1.3rem;padding-bottom:1.3rem;border-bottom:1px solid var(--border)}
.s-sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.s-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.s-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.s-inp{flex:1;min-width:130px;border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:.88rem;font-family:'Outfit',sans-serif;background:var(--paper)}
.s-inp:focus{outline:2px solid var(--accent);border-color:transparent}
.s-inp-sm{width:80px;flex:none}
.s-btn{border:none;border-radius:7px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif}
.s-btn-save{background:var(--ink);color:#fff}.s-btn-save:hover{background:#2a2a30}
.s-btn-add{background:var(--cream);color:var(--ink)}.s-btn-add:hover{background:#ddd8d0}
.s-saved{font-size:.78rem;color:var(--stx);font-weight:500;opacity:0;transition:opacity .2s}.s-saved.show{opacity:1}
.s-chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border-radius:20px;padding:4px 10px 4px 12px;font-size:.82rem;margin:3px}
.s-chip button{background:none;border:none;cursor:pointer;font-size:.9rem;color:var(--muted);padding:0 2px}.s-chip button:hover{color:var(--accent)}
.key-hidden{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--stx)}

/* MAIN */
.wrap{max-width:960px;margin:0 auto;padding:1.4rem}
.search-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.3rem;box-shadow:var(--shadow);margin-bottom:1rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:10px}
@media(max-width:540px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}
.field label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.9rem;font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,69,42,.1)}
.filter-info{font-size:.76rem;color:var(--muted);margin-bottom:10px}
.search-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:11px;font-size:.93rem;font-family:'Outfit',sans-serif;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.search-btn:hover{background:#28282e}.search-btn:disabled{background:#b0aba4;cursor:not-allowed}
.status-bar{margin-top:9px;font-size:.83rem;color:var(--muted);min-height:20px;display:flex;align-items:center;gap:8px}
.spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:none}
.spinner.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:#fff3f0;border:1px solid #f0c8c0;border-radius:10px;padding:.85rem;font-size:.84rem;color:var(--accent);margin-top:9px;display:none}.error-msg.show{display:block}
.no-key-msg{background:#fff3f0;border:1px solid #f0c8c0;border-radius:10px;padding:.85rem;font-size:.84rem;color:var(--accent);margin-bottom:1rem;display:none}.no-key-msg.show{display:block}

/* RESULTS TOP BAR */
.results-wrap{display:none}.results-wrap.visible{display:block}
.results-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:8px}
.results-count{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700}.results-count span{color:var(--accent)}
.controls-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* SORT */
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.ctrl-select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:.83rem;font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);cursor:pointer}
.ctrl-select:focus{outline:none;border-color:var(--accent)}

/* RADIUS SLIDER */
.radius-wrap{display:flex;align-items:center;gap:7px}
.radius-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.radius-val{font-size:.82rem;font-weight:700;color:var(--accent);min-width:48px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}

/* MAP */
.map-container{border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:1rem;height:300px;background:var(--cream)}
.section-heading{font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:1rem 0 .5rem;padding-bottom:5px;border-bottom:1px solid var(--border)}
.section-heading:first-child{margin-top:0}
.other-heading{color:#a09060;border-color:#e0d8c0}

/* 2-COL CARDS */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.cards-grid{grid-template-columns:1fr}}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.85rem 1rem;animation:fadeUp .3s ease both;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:5px}
.result-card:hover{box-shadow:0 3px 16px rgba(0,0,0,.09);transform:translateY(-1px)}
.result-card.dimmed{opacity:.62}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.card-name{font-size:.92rem;font-weight:600;line-height:1.3}
.badge-num{width:22px;height:22px;border-radius:50%;background:var(--cream);color:var(--muted);font-size:.68rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-desc{font-size:.75rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:.68rem;font-weight:500;padding:2px 8px;border-radius:20px}
.pill-local{background:var(--sbg);color:var(--stx)}.pill-neutral{background:var(--cream);color:var(--muted)}.pill-drive{background:var(--wbg);color:var(--wtx)}.pill-open{background:var(--sbg);color:var(--stx)}.pill-closed{background:#fde8e8;color:var(--accent)}
.stars{color:#e0a020;font-size:.78rem}
.rating-line{font-size:.78rem;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rv-link{color:var(--accent2);cursor:pointer;text-decoration:underline;font-size:.75rem}.rv-link:hover{color:var(--accent)}
.card-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.btn-a{font-size:.73rem;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;transition:background .12s}
.btn-a:hover{background:var(--cream)}.btn-a.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-a.primary:hover{background:#2a2a30}
.map-check{display:flex;align-items:center;gap:4px;font-size:.73rem;color:var(--muted);cursor:pointer;user-select:none;margin-top:3px}
.map-check input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer}

/* REVIEWS MODAL — scrollable, responsive */
.rv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.rv-overlay.open{display:flex}
.rv-panel{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:88vh;min-height:0;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);overflow:hidden}
.rv-head{padding:1.2rem 1.4rem .9rem;border-bottom:1px solid var(--border);flex-shrink:0}
.rv-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rv-name{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;line-height:1.3}
.rv-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);flex-shrink:0;padding:0 2px;line-height:1}
.rv-summary{font-size:.8rem;color:var(--muted);margin-top:4px}
.rv-scroll{overflow-y:auto;flex:1;padding:0 1.4rem;-webkit-overflow-scrolling:touch}
.rv-item{border-bottom:1px solid var(--border);padding:.75rem 0}
.rv-item:last-child{border-bottom:none;padding-bottom:1rem}
.rv-author{font-weight:600;font-size:.86rem}
.rv-date{font-size:.72rem;color:var(--muted);margin-bottom:3px}
.rv-stars{font-size:.78rem;color:#e0a020;margin-bottom:4px}
.rv-text{font-size:.84rem;line-height:1.55}
.rv-loading,.rv-none{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.88rem}

footer{text-align:center;padding:1.4rem;font-size:.72rem;color:var(--muted);border-top:1px solid var(--border);margin-top:2rem}
</style>
</head>
<body>

<header>
  <div class="h-inner">
    <div><div class="logo">Task<span>Finder</span></div><div class="tagline">Find local service providers near any address</div></div>
    <button class="gear-btn" onclick="toggleSettings()">&#9881;</button>
  </div>
</header>

<!-- SETTINGS OVERLAY -->
<div class="overlay" id="overlay" onclick="if(event.target===this)toggleSettings()">
  <div class="s-panel">
    <div class="s-header">
      <div class="s-title">Settings <button class="s-close" onclick="toggleSettings()">&times;</button></div>
    </div>
    <div class="s-body">
      <div class="s-sec">
        <div class="s-lbl">API Keys</div>
        <div id="keysArea"></div>
      </div>
      <div class="s-sec">
        <div class="s-lbl">Filter Requirements</div>
        <div class="s-row"><span style="font-size:.85rem;min-width:115px">Min Rating:</span><input type="number" class="s-inp s-inp-sm" id="setMinRating" step="0.1" min="1" max="5"/></div>
        <div class="s-row"><span style="font-size:.85rem;min-width:115px">Min Reviews:</span><input type="number" class="s-inp s-inp-sm" id="setMinReviews" min="0"/></div>
        <div class="s-row"><span style="font-size:.85rem;min-width:115px">Max Drive Time:</span><input type="number" class="s-inp s-inp-sm" id="setMaxDrive" min="1"/><span style="font-size:.8rem;color:var(--muted)">min</span></div>
        <div class="s-row" style="margin-top:6px"><button class="s-btn s-btn-save" onclick="saveReq()">Save Requirements</button><span class="s-saved" id="reqSaved">&#10003; Saved</span></div>
      </div>
      <div class="s-sec">
        <div class="s-lbl">Service Types</div>
        <div id="svcChips"></div>
        <div class="s-row" style="margin-top:8px"><input type="text" class="s-inp" id="newSvcInput" placeholder="Add new service type..."/><button class="s-btn s-btn-add" onclick="addSvc()">+ Add</button></div>
      </div>
    </div>
  </div>
</div>

<!-- REVIEWS MODAL -->
<div class="rv-overlay" id="rvOverlay" onclick="if(event.target===this)closeReviews()">
  <div class="rv-panel">
    <div class="rv-head">
      <div class="rv-title-row">
        <div class="rv-name" id="rvTitle">Reviews</div>
        <button class="rv-close" onclick="closeReviews()">&times;</button>
      </div>
      <div class="rv-summary" id="rvSummary"></div>
    </div>
    <div class="rv-scroll" id="rvBody"></div>
  </div>
</div>

<div class="wrap">
  <div class="no-key-msg" id="noKeyMsg">Configure your API keys in &#9881; Settings first.</div>
  <div class="search-card">
    <div class="fields">
      <div class="field full"><label>Address / City / ZIP / Neighborhood</label><input type="text" id="address" placeholder="e.g. 49127 or 4564 Cleveland Ave., Stevensville MI"/></div>
      <div class="field"><label>Service Type</label><select id="service"></select></div>
      <div class="field"><label>Search Source</label><select id="sourceSelect">
        <option value="google">Google (Local)</option>
        <option value="taskrabbit">TaskRabbit</option>
        <option value="thumbtack">Thumbtack</option>
        <option value="angi">Angi</option>
        <option value="homeadvisor">HomeAdvisor</option>
      </select></div>
    </div>
    <div class="filter-info" id="filterInfo"></div>
    <button class="search-btn" id="searchBtn" onclick="doSearch()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Find Providers
    </button>
    <div class="status-bar"><div class="spinner" id="spinner"></div><span id="statusText"></span></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="results-wrap" id="resultsWrap">
    <div class="results-top">
      <div class="results-count" id="resultsCount"></div>
      <div class="controls-bar">
        <div class="ctrl-group">
          <span class="ctrl-label">Sort:</span>
          <select class="ctrl-select" id="liveFilter" onchange="applyFilter()">
            <option value="rating">Best Rated</option>
            <option value="reviews">Most Reviews</option>
            <option value="distance">Closest</option>
          </select>
        </div>
        <div class="radius-wrap">
          <span class="radius-lbl">Radius:</span>
          <input type="range" id="radiusSlider" min="5" max="50" step="5" value="25" oninput="onRadiusChange(this.value)"/>
          <span class="radius-val" id="radiusVal">25 mi</span>
        </div>
      </div>
    </div>
    <div class="map-container" id="mapContainer" style="display:none"></div>
    <div id="resultsGrid"></div>
  </div>
</div>

<footer>TaskFinder &middot; Powered by Google Places</footer>

<script>
// ======================= CONFIG =======================
var DS=['Home cleaning','Handyman / repairs','Moving help','Furniture assembly','Yard work / landscaping','General tasks','Mobile Notary','Dumpster rental','Junk Removal','Storage units'];
var C={workerUrl:'',mapsKey:'',minRating:4.7,minReviews:50,maxDrive:20,services:DS.slice(),keysVisible:true};
function lc(){try{var s=localStorage.getItem('tf3_config');if(s)Object.assign(C,JSON.parse(s));}catch(e){}}
function sc(){localStorage.setItem('tf3_config',JSON.stringify(C));}
lc();

// ======================= SETTINGS =======================
function toggleSettings(){var o=document.getElementById('overlay');o.classList.toggle('open');if(o.classList.contains('open'))renderS();}
function renderS(){
  var ka=document.getElementById('keysArea');
  if(C.keysVisible||!C.mapsKey){
    ka.innerHTML=
      '<div class="s-row"><span style="font-size:.85rem;min-width:95px">Worker URL:</span><input type="text" class="s-inp" id="sk1" value="'+(C.workerUrl||'')+'" placeholder="https://your-worker.workers.dev"/></div>'+
      '<div class="s-row"><span style="font-size:.85rem;min-width:95px">Google Maps:</span><input type="password" class="s-inp" id="sk2" value="'+(C.mapsKey||'')+'" placeholder="Google Maps API key"/></div>'+
      '<div class="s-row" style="margin-top:6px"><button class="s-btn s-btn-save" onclick="saveKeys()">Save &amp; Hide</button><span class="s-saved" id="keySaved">&#10003; Saved</span></div>';
  } else {
    ka.innerHTML='<div class="key-hidden">&#128274; Keys saved &nbsp;<button class="s-btn s-btn-add" onclick="C.keysVisible=true;renderS()">Edit</button></div>';
  }
  document.getElementById('setMinRating').value=C.minRating;
  document.getElementById('setMinReviews').value=C.minReviews;
  document.getElementById('setMaxDrive').value=C.maxDrive;
  renderChips();updateFI();
}
function saveKeys(){C.workerUrl=document.getElementById('sk1').value.trim().replace(/\/$/,'');C.mapsKey=document.getElementById('sk2').value.trim();C.keysVisible=false;sc();flash('keySaved');renderS();initGMaps();}
function saveReq(){C.minRating=parseFloat(document.getElementById('setMinRating').value)||4.7;C.minReviews=parseInt(document.getElementById('setMinReviews').value)||50;C.maxDrive=parseInt(document.getElementById('setMaxDrive').value)||20;sc();flash('reqSaved');updateFI();}
function renderChips(){document.getElementById('svcChips').innerHTML=C.services.map(function(s,i){return'<span class="s-chip">'+esc(s)+' <button onclick="rmSvc('+i+')">&times;</button></span>';}).join('');}
function addSvc(){var inp=document.getElementById('newSvcInput'),v=inp.value.trim();if(!v)return;if(C.services.indexOf(v)===-1)C.services.push(v);inp.value='';sc();renderChips();popSvc();}
function rmSvc(i){C.services.splice(i,1);sc();renderChips();popSvc();}
function flash(id){var e=document.getElementById(id);e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2000);}
function updateFI(){var e=document.getElementById('filterInfo');if(e)e.textContent='Requirements: Rating \u2265 '+C.minRating+' \u00b7 Reviews \u2265 '+C.minReviews+' \u00b7 Drive \u2264 '+C.maxDrive+' min';}
function popSvc(){var s=document.getElementById('service'),p=s.value;s.innerHTML='<option value="">Select a service...</option>';C.services.forEach(function(v){var o=document.createElement('option');o.value=v.toLowerCase();o.textContent=v;s.appendChild(o);});s.value=p;}

// ======================= RADIUS SLIDER =======================
var currentRadius=25;
function onRadiusChange(v){
  currentRadius=parseInt(v);
  document.getElementById('radiusVal').textContent=currentRadius+' mi';
  applyFilter();
}

// ======================= GOOGLE MAPS =======================
var gmap,gmarkers=[],mapsOk=false,originAddr='',originCoords=null,cardPins={},cardRoutes={};
var directionsService=null;

function initGMaps(){
  if(mapsOk||!C.mapsKey)return;
  if(typeof google!=='undefined'&&google.maps){mapsOk=true;directionsService=new google.maps.DirectionsService();return;}
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(C.mapsKey)+'&libraries=directions&callback=onMR';
  s.async=true;document.body.appendChild(s);
}
window.onMR=function(){mapsOk=true;directionsService=new google.maps.DirectionsService();};

function setupMap(lat,lng){
  var c=document.getElementById('mapContainer');c.style.display='block';
  gmap=new google.maps.Map(c,{center:{lat:lat,lng:lng},zoom:11,
    styles:[{featureType:'poi',stylers:[{visibility:'off'}]},{featureType:'transit',stylers:[{visibility:'simplified'}]}]});
  // Clear old markers and routes
  gmarkers.forEach(function(m){m.setMap(null);});gmarkers=[];
  Object.keys(cardRoutes).forEach(function(k){if(cardRoutes[k])cardRoutes[k].setMap(null);});
  cardPins={};cardRoutes={};
  var om=new google.maps.Marker({position:{lat:lat,lng:lng},map:gmap,
    icon:{url:'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'},title:'Your location'});
  gmarkers.push(om);
}

// Route colors — each pin gets its own color
var ROUTE_COLORS=['#c0452a','#2963c8','#1a7a3a','#b06a00','#7b2d8b','#0097a7','#e65100','#37474f'];

async function togglePin(idx){
  var r=visibleResults[idx];if(!r||!gmap)return;
  var cb=document.getElementById('mc_'+idx);if(!cb)return;

  if(cb.checked){
    // Get coords
    var lat=r.lat,lng=r.lng;
    if(!lat&&r.address){
      try{
        var d=await px({mode:'geocode',address:r.address,key:C.mapsKey});
        if(d.results&&d.results.length){lat=d.results[0].geometry.location.lat;lng=d.results[0].geometry.location.lng;r.lat=lat;r.lng=lng;}
      }catch(e){}
    }
    if(!lat||!lng){cb.checked=false;alert('Could not locate this business.');return;}

    // Place marker
    var color=ROUTE_COLORS[Object.keys(cardPins).length%ROUTE_COLORS.length];
    var m=new google.maps.Marker({
      position:{lat:lat,lng:lng},map:gmap,title:r.name,
      label:{text:String(idx+1),color:'#fff',fontSize:'11px',fontWeight:'600'},
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:14,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
    });
    cardPins[idx]=m;gmarkers.push(m);

    // Draw route from origin to this pin
    if(directionsService&&originCoords){
      var routeRenderer=new google.maps.DirectionsRenderer({
        map:gmap,
        suppressMarkers:true,
        polylineOptions:{strokeColor:color,strokeWeight:4,strokeOpacity:0.75}
      });
      directionsService.route({
        origin:new google.maps.LatLng(originCoords.lat,originCoords.lng),
        destination:new google.maps.LatLng(lat,lng),
        travelMode:google.maps.TravelMode.DRIVING
      },function(result,status){
        if(status==='OK'){routeRenderer.setDirections(result);cardRoutes[idx]=routeRenderer;}
      });
    }

    // Fit bounds
    var b=new google.maps.LatLngBounds();
    gmarkers.forEach(function(mk){b.extend(mk.getPosition());});
    gmap.fitBounds(b);if(gmarkers.length<=2)gmap.setZoom(13);

  } else {
    // Remove marker
    if(cardPins[idx]){cardPins[idx].setMap(null);var mi=gmarkers.indexOf(cardPins[idx]);if(mi>-1)gmarkers.splice(mi,1);delete cardPins[idx];}
    // Remove route
    if(cardRoutes[idx]){cardRoutes[idx].setMap(null);delete cardRoutes[idx];}
  }
}

// ======================= PROXY =======================
async function px(params){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  var r=await fetch(C.workerUrl+'?'+qs);
  if(!r.ok)throw new Error('Proxy '+r.status);
  return r.json();
}

// ======================= PLACES SEARCH =======================
// Searches with location bias (radius in meters) for closest results
async function searchPlaces(query, lat, lng){
  var radiusMeters=50000; // Always search wide (50km), slider filters display
  var results=[];

  // Use nearby search with location bias for better local results
  var q=encodeURIComponent(query);
  var d=await px({mode:'places_search',q:query,key:C.mapsKey,lat:lat,lng:lng,radius:radiusMeters});
  if(d.results)results=results.concat(d.results);

  // Page 2
  if(d.next_page_token){
    await sleep(2000);
    try{var d2=await px({mode:'places_search',q:query,key:C.mapsKey,pagetoken:d.next_page_token});
      if(d2.results)results=results.concat(d2.results);}catch(e){}
  }

  // Page 3 (up to 60 results total)
  if(d.next_page_token){
    await sleep(2000);
    try{var d3=await px({mode:'places_search',q:query,key:C.mapsKey,pagetoken:d.next_page_token});
      if(d3.results)results=results.concat(d3.results);}catch(e){}
  }

  return results.map(function(p){
    var loc=p.geometry&&p.geometry.location;
    return{
      name:p.name||'Unknown',placeId:p.place_id||null,
      address:p.formatted_address||p.vicinity||null,
      rating:p.rating?parseFloat(p.rating):null,
      reviews:p.user_ratings_total||0,
      price:p.price_level?'$'.repeat(p.price_level):null,
      phone:null,website:null,
      lat:loc?loc.lat:null,lng:loc?loc.lng:null,
      desc:p.types?p.types.filter(function(t){return t!=='establishment'&&t!=='point_of_interest';}).slice(0,2).map(function(t){return t.replace(/_/g,' ');}).join(', '):'',
      driveMin:null,driveTxt:null,distTxt:null,distMiles:null,
      open:p.opening_hours?p.opening_hours.open_now:null
    };
  });
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function geocodeAddr(addr){
  try{var d=await px({mode:'geocode',address:addr,key:C.mapsKey});if(d.results&&d.results.length)return d.results[0].geometry.location;}catch(e){}
  return null;
}

async function getDriveTimes(origin,addrs){
  if(!addrs.length)return[];
  var out=[];
  for(var i=0;i<addrs.length;i+=25){
    var batch=addrs.slice(i,i+25);
    try{
      var d=await px({mode:'distance',origins:origin,destinations:batch.join('|'),key:C.mapsKey});
      if(d.rows&&d.rows[0]&&d.rows[0].elements){
        d.rows[0].elements.forEach(function(el){
          if(el.status==='OK'){
            var distM=el.distance.value/1609.34; // meters to miles
            out.push({driveMin:Math.round(el.duration.value/60),driveTxt:el.duration.text,distTxt:el.distance.text,distMiles:distM});
          } else out.push({driveMin:null,driveTxt:null,distTxt:null,distMiles:null});
        });
      } else batch.forEach(function(){out.push({driveMin:null,driveTxt:null,distTxt:null,distMiles:null});});
    }catch(e){batch.forEach(function(){out.push({driveMin:null,driveTxt:null,distTxt:null,distMiles:null});});}
  }
  return out;
}

// ======================= PLATFORM URLS =======================
var PLATFORMS={
  taskrabbit:{
    name:'TaskRabbit',color:'#6aa84f',
    url:function(svc,addr){
      var city=extractCity(addr);
      return'https://www.taskrabbit.com/search#?utf8=%E2%9C%93&q='+encodeURIComponent(svc)+'&location='+encodeURIComponent(city);
    }
  },
  thumbtack:{
    name:'Thumbtack',color:'#00b3a4',
    url:function(svc,addr){
      var city=extractCity(addr);
      return'https://www.thumbtack.com/search/?q='+encodeURIComponent(svc)+'&requestPostalCode='+encodeURIComponent(city);
    }
  },
  angi:{
    name:'Angi',color:'#ff5a5f',
    url:function(svc,addr){
      var city=extractCity(addr);
      return'https://www.angi.com/hire/'+encodeURIComponent(svc.toLowerCase().replace(/\s+/g,'-'))+'/?location='+encodeURIComponent(city);
    }
  },
  homeadvisor:{
    name:'HomeAdvisor',color:'#f5a623',
    url:function(svc,addr){
      var city=extractCity(addr);
      return'https://www.homeadvisor.com/task.html?q='+encodeURIComponent(svc)+'&loc='+encodeURIComponent(city);
    }
  }
};

function extractCity(addr){
  var p=addr.trim().split(',');
  if(p.length>=2)return p.slice(-2).join(',').trim();
  return addr.trim();
}

function openPlatform(source,svc,addr){
  var p=PLATFORMS[source];if(!p)return;
  var url=p.url(svc,addr);
  var city=extractCity(addr);
  var rw=document.getElementById('resultsWrap');
  var grid=document.getElementById('resultsGrid');
  document.getElementById('mapContainer').style.display='none';
  document.getElementById('resultsCount').innerHTML='Search on <span>'+esc(p.name)+'</span>';

  grid.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2rem;text-align:center;">'
    +'<div style="font-size:2rem;margin-bottom:.8rem;">&#128279;</div>'
    +'<div style="font-family:\'Space Grotesk\',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:.5rem;">'+esc(p.name)+'</div>'
    +'<div style="font-size:.88rem;color:var(--muted);margin-bottom:1.2rem;">Click below to search <strong>'+esc(svc)+'</strong> near <strong>'+esc(city)+'</strong> on '+esc(p.name)+'</div>'
    +'<a href="'+url+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:'+p.color+';color:#fff;border-radius:9px;padding:12px 28px;font-size:.95rem;font-weight:600;text-decoration:none;">Open '+esc(p.name)+' &rarr;</a>'
    +'<div style="margin-top:1rem;font-size:.75rem;color:var(--muted)">Or copy this link:<br><a href="'+url+'" target="_blank" style="color:var(--accent2);word-break:break-all;font-size:.75rem;">'+url+'</a></div>'
    +'</div>';

  rw.classList.add('visible');
}
var allFetched=[],visibleResults=[],meetsArr=[],othersArr=[];

function normAddr(r){var c=r.trim(),p=c.split(',');if(p.length>=3)return p.slice(-2).join(',').trim();return c;}
function dedup(arr){var s={};return arr.filter(function(x){var k=x.placeId||x.name.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,25);if(s[k])return false;s[k]=true;return true;});}

function sortArr(arr,by){
  return arr.slice().sort(function(a,b){
    if(by==='rating')return(b.rating||0)-(a.rating||0);
    if(by==='reviews')return(b.reviews||0)-(a.reviews||0);
    if(by==='distance'){
      var da=a.driveMin!==null?a.driveMin:9999,db=b.driveMin!==null?b.driveMin:9999;
      return da-db;
    }
    return 0;
  });
}

// ======================= LIVE FILTER + RADIUS =======================
function applyFilter(){
  var by=document.getElementById('liveFilter').value;
  var radiusMiles=currentRadius;

  // Strict radius: only show results within the selected miles
  // Results with no distance data are always included (can't determine)
  var inRadius=allFetched.filter(function(r){
    if(r.distMiles===null||r.distMiles===undefined)return true;
    return r.distMiles<=radiusMiles;
  });

  // Split meets/others
  meetsArr=[];othersArr=[];
  inRadius.forEach(function(r){
    var pr=r.rating!==null&&r.rating>=C.minRating;
    var pv=r.reviews>=C.minReviews;
    var pd=r.driveMin===null||r.driveMin<=C.maxDrive;
    if(pr&&pv&&pd)meetsArr.push(r);else othersArr.push(r);
  });

  meetsArr=sortArr(meetsArr,by);
  othersArr=sortArr(othersArr,by);
  visibleResults=meetsArr.concat(othersArr);

  // Clear any pins/routes that are no longer visible
  Object.keys(cardPins).forEach(function(k){
    var stillVisible=visibleResults.some(function(r,i){return i===parseInt(k);});
    if(!stillVisible&&cardPins[k]){
      cardPins[k].setMap(null);
      if(cardRoutes[k])cardRoutes[k].setMap(null);
      delete cardPins[k];delete cardRoutes[k];
    }
  });

  var cnt=document.getElementById('resultsCount');
  var sel=document.getElementById('service');
  var svcLabel=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'';
  var hiddenCount=allFetched.length-inRadius.length;
  cnt.innerHTML='<span>'+visibleResults.length+'</span> providers &mdash; '+esc(svcLabel)+' &mdash; within '+radiusMiles+' mi'
    +(hiddenCount>0?' <span style="font-size:.75rem;color:var(--muted)">(+'+hiddenCount+' beyond radius)</span>':'');

  renderGrid(meetsArr,othersArr);
}

// ======================= MAIN SEARCH =======================
async function doSearch(){
  var address=document.getElementById('address').value.trim(),service=document.getElementById('service').value;
  var st=document.getElementById('statusText'),sp=document.getElementById('spinner'),btn=document.getElementById('searchBtn'),
    em=document.getElementById('errorMsg'),nk=document.getElementById('noKeyMsg'),
    rw=document.getElementById('resultsWrap'),grid=document.getElementById('resultsGrid');

  nk.classList.remove('show');em.classList.remove('show');
  if(!address){st.textContent='Enter an address.';return;}
  if(!service){st.textContent='Select a service.';return;}

  originAddr=address;originCoords=null;cardPins={};allFetched=[];meetsArr=[];othersArr=[];visibleResults=[];
  var svcLabel=document.getElementById('service').options[document.getElementById('service').selectedIndex].text;

  // Platform source — redirect instead of searching (no API keys needed)
  var source=document.getElementById('sourceSelect').value;
  if(source!=='google'){
    btn.disabled=false;sp.classList.remove('active');st.textContent='';
    rw.classList.remove('visible');grid.innerHTML='';
    openPlatform(source,svcLabel,address);
    return;
  }

  // Google — needs API keys
  if(!C.workerUrl||!C.mapsKey){nk.classList.add('show');return;}
  btn.disabled=true;sp.classList.add('active');rw.classList.remove('visible');grid.innerHTML='';
  document.getElementById('mapContainer').style.display='none';

  st.textContent='Locating your address...';
  originCoords=await geocodeAddr(address);
  if(!originCoords){
    btn.disabled=false;sp.classList.remove('active');
    em.textContent='Could not locate that address. Try a full address or city, state.';em.classList.add('show');return;
  }

  st.textContent='Searching Google Places for '+svcLabel+'...';

  var all=[];
  try{all=await searchPlaces(svcLabel,originCoords.lat,originCoords.lng);}catch(e){
    btn.disabled=false;sp.classList.remove('active');
    em.textContent='Search failed: '+e.message;em.classList.add('show');return;
  }
  all=dedup(all);

  if(!all.length){
    btn.disabled=false;sp.classList.remove('active');
    em.textContent='No results found. Try a different address or service type.';em.classList.add('show');return;
  }

  st.textContent='Calculating drive times for '+all.length+' results...';
  var addrs=all.map(function(r){return r.address||r.name;});
  var times=await getDriveTimes(address,addrs);
  times.forEach(function(t,i){if(i<all.length){all[i].driveMin=t.driveMin;all[i].driveTxt=t.driveTxt;all[i].distTxt=t.distTxt;all[i].distMiles=t.distMiles;}});

  allFetched=all;

  if(mapsOk)setupMap(originCoords.lat,originCoords.lng);
  else if(C.mapsKey)initGMaps();

  rw.classList.add('visible');
  applyFilter(); // renders grid with current radius + sort

  btn.disabled=false;sp.classList.remove('active');
  st.textContent=allFetched.length+' total results fetched. Showing within '+currentRadius+' mi.';
}

// ======================= RENDER =======================
function renderGrid(meets,others){
  var html='';
  if(meets.length){
    html+='<div class="section-heading">&#10003; Meets Requirements ('+meets.length+')</div><div class="cards-grid">';
    html+=meets.map(function(r,i){return renderCard(r,i,false);}).join('');
    html+='</div>';
  }
  if(others.length){
    html+='<div class="section-heading other-heading">&#128203; Other Results ('+others.length+')</div><div class="cards-grid">';
    html+=others.map(function(r,i){return renderCard(r,meets.length+i,true);}).join('');
    html+='</div>';
  }
  if(!meets.length&&!others.length){
    html='<div style="padding:2rem;text-align:center;color:var(--muted);font-size:.9rem">No results within '+currentRadius+' miles.<br>Try sliding the radius wider.</div>';
  }
  document.getElementById('resultsGrid').innerHTML=html;
}

function starsH(r){if(!r)return'';var n=parseFloat(r),f=Math.floor(n),h=n%1>=.5?1:0;return'\u2605'.repeat(f)+(h?'\u00BD':'')+'\u2606'.repeat(5-f-h);}

function renderCard(r,idx,dimmed){
  var delay=(idx%10*25)+'ms',cls='result-card'+(dimmed?' dimmed':'');
  var rh=r.rating
    ?'<span class="stars">'+starsH(r.rating)+'</span><strong>'+r.rating.toFixed(1)+'</strong> <span class="rv-link" onclick="openReviews('+idx+')">('+r.reviews.toLocaleString()+')</span>'
    :'<span style="color:var(--muted)">No rating yet</span>';
  var pills='<span class="pill pill-local">Local</span>';
  if(r.driveTxt)pills+='<span class="pill pill-drive">\uD83D\uDE97 '+esc(r.driveTxt)+'</span>';
  if(r.distTxt)pills+='<span class="pill pill-neutral">'+esc(r.distTxt)+'</span>';
  if(r.price)pills+='<span class="pill pill-neutral">'+esc(r.price)+'</span>';
  if(r.open===true)pills+='<span class="pill pill-open">Open now</span>';
  else if(r.open===false)pills+='<span class="pill pill-closed">Closed</span>';
  var acts='';
  if(r.phone)acts+='<a class="btn-a primary" href="tel:'+esc(r.phone)+'">&#128222; '+esc(r.phone)+'</a>';
  if(r.website)acts+='<a class="btn-a" href="'+esc(r.website)+'" target="_blank">&#127760; Site</a>';
  if(r.address)acts+='<a class="btn-a" href="https://maps.google.com/maps/dir/?api=1&origin='+encodeURIComponent(originAddr)+'&destination='+encodeURIComponent(r.address)+'" target="_blank">&#128205; Directions</a>';
  var chk='<label class="map-check"><input type="checkbox" id="mc_'+idx+'" onchange="togglePin('+idx+')"/> Show on map</label>';
  return '<div class="'+cls+'" style="animation-delay:'+delay+'">'
    +'<div class="card-top"><div class="card-name">'+esc(r.name)+'</div><div class="badge-num">'+(idx+1)+'</div></div>'
    +(r.desc?'<div class="card-desc">'+esc(r.desc)+'</div>':'')
    +'<div class="card-meta">'+pills+'</div>'
    +'<div class="rating-line">'+rh+'</div>'
    +(acts?'<div class="card-actions">'+acts+'</div>':'')
    +chk+'</div>';
}

// ======================= REVIEWS =======================
async function openReviews(idx){
  var r=visibleResults[idx];if(!r)return;
  document.getElementById('rvTitle').textContent=r.name;
  document.getElementById('rvSummary').textContent='';
  document.getElementById('rvBody').innerHTML='<div class="rv-loading">&#8987; Loading reviews...</div>';
  document.getElementById('rvOverlay').classList.add('open');
  try{
    var pid=r.placeId;
    if(!pid){
      var fRes=await px({mode:'places_find',q:r.name+(r.address?' '+r.address:''),key:C.mapsKey});
      if(fRes.candidates&&fRes.candidates.length)pid=fRes.candidates[0].place_id;
    }
    if(!pid){showNoReviews(r);return;}
    var det=await px({mode:'places_details',place_id:pid,key:C.mapsKey});
    var res=det.result;if(!res){showNoReviews(r);return;}
    if(res.formatted_phone_number&&!r.phone)r.phone=res.formatted_phone_number;
    if(res.website&&!r.website)r.website=res.website;
    var rvs=res.reviews||[];
    if(!rvs.length){showNoReviews(r);return;}
    document.getElementById('rvSummary').textContent=
      (res.rating?'\u2605 '+res.rating+' overall':'')+
      (res.user_ratings_total?' \u00b7 '+res.user_ratings_total.toLocaleString()+' total reviews':'');
    document.getElementById('rvBody').innerHTML=rvs.map(function(rv){
      return'<div class="rv-item">'
        +'<div class="rv-author">'+esc(rv.author_name||'Anonymous')+'</div>'
        +'<div class="rv-date">'+esc(rv.relative_time_description||'')+'</div>'
        +(rv.rating?'<div class="rv-stars">'+starsH(rv.rating)+' '+rv.rating+'</div>':'')
        +'<div class="rv-text">'+esc(rv.text||'No written review')+'</div>'
        +'</div>';
    }).join('');
  }catch(e){
    document.getElementById('rvBody').innerHTML='<div class="rv-none">Error: '+esc(e.message)+'</div>';
  }
}
function showNoReviews(r){
  document.getElementById('rvBody').innerHTML='<div class="rv-none">No Google reviews found.'+(r.website?'<br><br><a href="'+esc(r.website)+'" target="_blank" style="color:var(--accent2)">Visit their website</a>':'')+'</div>';
}
function closeReviews(){document.getElementById('rvOverlay').classList.remove('open');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
