<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TaskFinder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#101014;--paper:#f5f3ef;--cream:#eae7e0;--accent:#c0452a;--accent2:#2963c8;--muted:#78756e;--border:#d6d1c9;--card:#fff;--sbg:#e8f5ec;--stx:#1a7a3a;--pbg:#e8eef8;--ptx:#1a4a7a;--wbg:#fff4e8;--wtx:#b06a00;--shadow:0 2px 12px rgba(0,0,0,.07)}
body{font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}

header{background:var(--ink);padding:1.4rem 1.5rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-80px;right:-60px;width:240px;height:240px;border-radius:50%;background:var(--accent);opacity:.12}
.h-inner{max-width:960px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:#fff;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.tagline{font-size:.78rem;color:#a09888;margin-top:2px}
.gear-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.gear-btn:hover{background:rgba(255,255,255,.2)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.s-panel{background:var(--card);border-radius:14px;width:100%;max-width:580px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.s-header{padding:1.5rem 1.8rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.s-title{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.s-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.s-body{overflow-y:auto;flex:1;padding:1.2rem 1.8rem 1.8rem}
.s-sec{margin-bottom:1.3rem;padding-bottom:1.3rem;border-bottom:1px solid var(--border)}
.s-sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.s-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.s-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.s-inp{flex:1;min-width:130px;border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:.88rem;font-family:'Outfit',sans-serif;background:var(--paper)}
.s-inp:focus{outline:2px solid var(--accent);border-color:transparent}
.s-inp-sm{width:80px;flex:none}
.s-btn{border:none;border-radius:7px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif}
.s-btn-save{background:var(--ink);color:#fff}.s-btn-save:hover{background:#2a2a30}
.s-btn-add{background:var(--cream);color:var(--ink)}.s-btn-add:hover{background:#ddd8d0}
.s-saved{font-size:.78rem;color:var(--stx);font-weight:500;opacity:0;transition:opacity .2s}.s-saved.show{opacity:1}
.s-chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border-radius:20px;padding:4px 10px 4px 12px;font-size:.82rem;margin:3px}
.s-chip button{background:none;border:none;cursor:pointer;font-size:.9rem;color:var(--muted);padding:0 2px}.s-chip button:hover{color:var(--accent)}
.key-hidden{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--stx)}

.wrap{max-width:960px;margin:0 auto;padding:1.4rem}
.search-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.3rem;box-shadow:var(--shadow);margin-bottom:1rem}
.fields{display:grid;grid-template-columns:1fr;gap:11px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.9rem;font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,69,42,.1)}
.filter-info{font-size:.76rem;color:var(--muted);margin-bottom:10px}
.search-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:11px;font-size:.93rem;font-family:'Outfit',sans-serif;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.search-btn:hover{background:#28282e}.search-btn:disabled{background:#b0aba4;cursor:not-allowed}
.status-bar{margin-top:9px;font-size:.83rem;color:var(--muted);min-height:20px;display:flex;align-items:center;gap:8px}
.spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:none}
.spinner.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:#fff3f0;border:1px solid #f0c8c0;border-radius:10px;padding:.85rem;font-size:.84rem;color:var(--accent);margin-top:9px;display:none}.error-msg.show{display:block}
.no-key-msg{background:#fff3f0;border:1px solid #f0c8c0;border-radius:10px;padding:.85rem;font-size:.84rem;color:var(--accent);margin-bottom:1rem;display:none}.no-key-msg.show{display:block}

.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.src-chk{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--paper);cursor:pointer;font-size:.85rem;transition:background .12s,border-color .12s;user-select:none}
.src-chk:hover{background:var(--cream)}
.src-chk input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
.src-chk.active{background:#fbe9e3;border-color:var(--accent)}

.results-wrap{display:none}.results-wrap.visible{display:block}
.results-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:8px}
.results-count{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700}.results-count span{color:var(--accent)}
.controls-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.ctrl-select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:.83rem;font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);cursor:pointer}
.radius-wrap{display:flex;align-items:center;gap:7px}
.radius-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.radius-val{font-size:.82rem;font-weight:700;color:var(--accent);min-width:48px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}

.map-container{border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:1rem;height:300px;background:var(--cream)}

.source-section{margin-top:1.3rem;border-top:2px solid var(--border);padding-top:1rem}
.source-section:first-child{margin-top:0;border-top:none;padding-top:0}
.source-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;gap:8px;flex-wrap:wrap}
.source-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.source-badge{font-size:.7rem;padding:2px 9px;border-radius:20px;color:#fff;font-weight:600}
.source-meta{font-size:.78rem;color:var(--muted)}
.section-heading{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:.7rem 0 .45rem;padding-bottom:4px;border-bottom:1px solid var(--border)}
.other-heading{color:#a09060;border-color:#e0d8c0}

.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.cards-grid{grid-template-columns:1fr}}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.85rem 1rem;animation:fadeUp .3s ease both;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:5px}
.result-card:hover{box-shadow:0 3px 16px rgba(0,0,0,.09);transform:translateY(-1px)}
.result-card.dimmed{opacity:.62}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.card-name{font-size:.92rem;font-weight:600;line-height:1.3}
.badge-num{width:22px;height:22px;border-radius:50%;background:var(--cream);color:var(--muted);font-size:.68rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-desc{font-size:.75rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:.68rem;font-weight:500;padding:2px 8px;border-radius:20px}
.pill-local{background:var(--sbg);color:var(--stx)}.pill-neutral{background:var(--cream);color:var(--muted)}.pill-drive{background:var(--wbg);color:var(--wtx)}.pill-open{background:var(--sbg);color:var(--stx)}.pill-closed{background:#fde8e8;color:var(--accent)}
.stars{color:#e0a020;font-size:.78rem}
.rating-line{font-size:.78rem;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rv-link{color:var(--accent2);cursor:pointer;text-decoration:underline;font-size:.75rem}.rv-link:hover{color:var(--accent)}
.card-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.btn-a{font-size:.73rem;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;transition:background .12s;font-family:'Outfit',sans-serif}
.btn-a:hover{background:var(--cream)}.btn-a.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-a.primary:hover{background:#2a2a30}
.map-check{display:flex;align-items:center;gap:4px;font-size:.73rem;color:var(--muted);cursor:pointer;user-select:none;margin-top:3px}
.map-check input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer}

.rv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.rv-overlay.open{display:flex}
.rv-panel{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:88vh;min-height:0;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);overflow:hidden}
.rv-head{padding:1.2rem 1.4rem .9rem;border-bottom:1px solid var(--border);flex-shrink:0}
.rv-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rv-name{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;line-height:1.3}
.rv-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);flex-shrink:0;padding:0 2px;line-height:1}
.rv-summary{font-size:.8rem;color:var(--muted);margin-top:4px}
.rv-scroll{overflow-y:auto;flex:1;padding:0 1.4rem;-webkit-overflow-scrolling:touch}
.rv-item{border-bottom:1px solid var(--border);padding:.75rem 0}
.rv-item:last-child{border-bottom:none;padding-bottom:1rem}
.rv-author{font-weight:600;font-size:.86rem}
.rv-date{font-size:.72rem;color:var(--muted);margin-bottom:3px}
.rv-stars{font-size:.78rem;color:#e0a020;margin-bottom:4px}
.rv-text{font-size:.84rem;line-height:1.55}
.rv-loading,.rv-none{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.88rem}

footer{text-align:center;padding:1.4rem;font-size:.72rem;color:var(--muted);border-top:1px solid var(--border);margin-top:2rem}
</style>
</head>
<body>

<header>
  <div class="h-inner">
    <div><div class="logo">Task<span>Finder</span></div><div class="tagline">Find local service providers near any address</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="headerUsage" style="font-size:.72rem;color:#a09888;display:flex;gap:14px;align-items:center"></div>
      <button class="gear-btn" onclick="toggleSettings()">&#9881;</button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay" onclick="if(event.target===this)toggleSettings()">
  <div class="s-panel">
    <div class="s-header">
      <div class="s-title">Settings <button class="s-close" onclick="toggleSettings()">&times;</button></div>
    </div>
    <div class="s-body">
      <div class="s-sec">
        <div class="s-lbl">API Keys</div>
        <div id="keysArea"></div>
      </div>
      <div class="s-sec">
        <div class="s-lbl">Filter Requirements</div>
        <div class="s-row"><span style="font-size:.85rem;min-width:115px">Min Rating:</span><input type="number" class="s-inp s-inp-sm" id="setMinRating" step="0.1" min="1" max="5"/></div>
        <div class="s-row"><span style="font-size:.85rem;min-width:115px">Min Reviews:</span><input type="number" class="s-inp s-inp-sm" id="setMinReviews" min="0"/></div>
        <div class="s-row"><span style="font-size:.85rem;min-width:115px">Max Drive Time:</span><input type="number" class="s-inp s-inp-sm" id="setMaxDrive" min="1"/><span style="font-size:.8rem;color:var(--muted)">min</span></div>
        <div class="s-row" style="margin-top:6px"><button class="s-btn s-btn-save" onclick="saveReq()">Save Requirements</button><span class="s-saved" id="reqSaved">&#10003; Saved</span></div>
      </div>
      <div class="s-sec">
        <div class="s-lbl">Service Types</div>
        <div id="svcChips"></div>
        <div class="s-row" style="margin-top:8px"><input type="text" class="s-inp" id="newSvcInput" placeholder="Add new service type..."/><button class="s-btn s-btn-add" onclick="addSvc()">+ Add</button></div>
      </div>

    </div>
  </div>
</div>

<div class="rv-overlay" id="rvOverlay" onclick="if(event.target===this)closeReviews()">
  <div class="rv-panel">
    <div class="rv-head">
      <div class="rv-title-row">
        <div class="rv-name" id="rvTitle">Reviews</div>
        <button class="rv-close" onclick="closeReviews()">&times;</button>
      </div>
      <div class="rv-summary" id="rvSummary"></div>
    </div>
    <div class="rv-scroll" id="rvBody"></div>
  </div>
</div>

<div class="wrap">
  <div class="no-key-msg" id="noKeyMsg">Configure your API keys in &#9881; Settings first.</div>
  <div class="search-card">
    <div class="fields">
      <div class="field"><label>Address / City / ZIP / Neighborhood</label><input type="text" id="address" placeholder="e.g. 49127 or 4564 Cleveland Ave., Stevensville MI"/></div>
      <div class="field"><label>Service Type</label><select id="service"></select></div>
      <div class="field"><label>Search Sources (pick one or more)</label>
        <div class="src-grid" id="srcGrid"></div>
      </div>
    </div>
    <div class="filter-info" id="filterInfo"></div>
    <button class="search-btn" id="searchBtn" onclick="doSearch()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Find Providers
    </button>
    <div class="status-bar"><div class="spinner" id="spinner"></div><span id="statusText"></span></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="results-wrap" id="resultsWrap">
    <div class="results-top">
      <div class="results-count" id="resultsCount"></div>
      <div class="controls-bar">
        <div class="ctrl-group">
          <span class="ctrl-label">Sort:</span>
          <select class="ctrl-select" id="liveFilter" onchange="applyFilter()">
            <option value="rating">Best Rated</option>
            <option value="reviews">Most Reviews</option>
            <option value="distance">Closest</option>
          </select>
        </div>
        <div class="radius-wrap">
          <span class="radius-lbl">Radius:</span>
          <input type="range" id="radiusSlider" min="5" max="100" step="5" value="50" oninput="onRadiusChange(this.value)"/>
          <span class="radius-val" id="radiusVal">50 mi</span>
        </div>
      </div>
    </div>
    <div class="map-container" id="mapContainer" style="display:none"></div>
    <div id="resultsGrid"></div>
  </div>
</div>

<footer>TaskFinder &middot; Powered by Google Places + Apify</footer>

<script>
var DS=['Home cleaning','Handyman / repairs','Moving help','Furniture assembly','Yard work / landscaping','General tasks','Mobile Notary','Dumpster rental','Junk Removal','Storage units'];
var C={
  workerUrl:'',mapsKey:'',apifyToken:'',
  minRating:4.7,minReviews:50,maxDrive:20,
  services:DS.slice(),
  selectedSources:['google'],
  keysVisible:true,
  gMapsCalls:0,apifyRuns:0,lastUsageDate:''
};
function lc(){try{var s=localStorage.getItem('tf4_config');if(s)Object.assign(C,JSON.parse(s));}catch(e){}}
function sc(){localStorage.setItem('tf4_config',JSON.stringify(C));}
lc();

var SOURCES={
  google:    {name:'Google',     color:'#4285f4', kind:'google'},
  taskrabbit:{name:'TaskRabbit', color:'#6aa84f', kind:'redirect', urlFn:function(svc,city){return'https://www.taskrabbit.com/search#?utf8=%E2%9C%93&q='+encodeURIComponent(svc)+'&location='+encodeURIComponent(city);}},
  thumbtack: {name:'Thumbtack',  color:'#00b3a4', kind:'redirect', urlFn:function(svc,city){return'https://www.thumbtack.com/search/?q='+encodeURIComponent(svc)+'&requestPostalCode='+encodeURIComponent(city);}},
  craigslist:{name:'Craigslist', color:'#5d3fd3', kind:'craigslist'}
};

function renderSourceCheckboxes(){
  var grid=document.getElementById('srcGrid');var html='';
  Object.keys(SOURCES).forEach(function(k){
    var s=SOURCES[k];var checked=C.selectedSources.indexOf(k)>-1;
    html+='<label class="src-chk'+(checked?' active':'')+'" data-src="'+k+'">'
      +'<input type="checkbox" '+(checked?'checked':'')+' onchange="toggleSource(\''+k+'\',this)"/>'
      +'<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+s.color+'"></span>'
      +esc(s.name)+'</label>';
  });
  grid.innerHTML=html;
}
function toggleSource(key,cb){
  if(cb.checked){if(C.selectedSources.indexOf(key)===-1)C.selectedSources.push(key);}
  else{C.selectedSources=C.selectedSources.filter(function(k){return k!==key;});}
  var lbl=cb.closest('.src-chk');if(lbl)lbl.classList.toggle('active',cb.checked);
  sc();
}

function toggleSettings(){var o=document.getElementById('overlay');o.classList.toggle('open');if(o.classList.contains('open')){renderS();}}
function renderS(){
  var ka=document.getElementById('keysArea');
  if(C.keysVisible||!C.mapsKey){
    ka.innerHTML=
      '<div class="s-row"><span style="font-size:.85rem;min-width:95px">Worker URL:</span><input type="text" class="s-inp" id="sk1" value="'+(C.workerUrl||'')+'" placeholder="https://your-worker.workers.dev"/></div>'+
      '<div class="s-row"><span style="font-size:.85rem;min-width:95px">Google Maps:</span><input type="password" class="s-inp" id="sk2" value="'+(C.mapsKey||'')+'" placeholder="Google Maps API key"/></div>'+
      
      '<div class="s-row" style="margin-top:6px"><button class="s-btn s-btn-save" onclick="saveKeys()">Save &amp; Hide</button><span class="s-saved" id="keySaved">&#10003; Saved</span></div>';
  } else {
    ka.innerHTML='<div class="key-hidden">&#128274; Keys saved &nbsp;<button class="s-btn s-btn-add" onclick="C.keysVisible=true;renderS()">Edit</button></div>';
  }
  document.getElementById('setMinRating').value=C.minRating;
  document.getElementById('setMinReviews').value=C.minReviews;
  document.getElementById('setMaxDrive').value=C.maxDrive;
  renderChips();updateFI();
}
function saveKeys(){C.workerUrl=document.getElementById('sk1').value.trim().replace(/\/$/,'');C.mapsKey=document.getElementById('sk2').value.trim();C.keysVisible=false;sc();flash('keySaved');renderS();initGMaps();refreshUsage();}
function saveReq(){C.minRating=parseFloat(document.getElementById('setMinRating').value)||4.7;C.minReviews=parseInt(document.getElementById('setMinReviews').value)||50;C.maxDrive=parseInt(document.getElementById('setMaxDrive').value)||20;sc();flash('reqSaved');updateFI();}
function renderChips(){document.getElementById('svcChips').innerHTML=C.services.map(function(s,i){return'<span class="s-chip">'+esc(s)+' <button onclick="rmSvc('+i+')">&times;</button></span>';}).join('');}
function addSvc(){var inp=document.getElementById('newSvcInput'),v=inp.value.trim();if(!v)return;if(C.services.indexOf(v)===-1)C.services.push(v);inp.value='';sc();renderChips();popSvc();}
function rmSvc(i){C.services.splice(i,1);sc();renderChips();popSvc();}
function flash(id){var e=document.getElementById(id);e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2000);}
function updateFI(){var e=document.getElementById('filterInfo');if(e)e.textContent='Requirements: Rating \u2265 '+C.minRating+' \u00b7 Reviews \u2265 '+C.minReviews+' \u00b7 Drive \u2264 '+C.maxDrive+' min';}
function popSvc(){var s=document.getElementById('service'),p=s.value;s.innerHTML='<option value="">Select a service...</option>';C.services.forEach(function(v){var o=document.createElement('option');o.value=v.toLowerCase();o.textContent=v;s.appendChild(o);});s.value=p;}

function bumpGoogle(n){var t=new Date().toISOString().slice(0,10);if(C.lastUsageDate!==t){C.gMapsCalls=0;C.apifyRuns=0;C.lastUsageDate=t;}C.gMapsCalls=(C.gMapsCalls||0)+(n||1);sc();}
function bumpApify(n){var t=new Date().toISOString().slice(0,10);if(C.lastUsageDate!==t){C.gMapsCalls=0;C.apifyRuns=0;C.lastUsageDate=t;}C.apifyRuns=(C.apifyRuns||0)+(n||1);sc();}

async function refreshUsage(){
  var t=new Date().toISOString().slice(0,10);
  if(C.lastUsageDate!==t){C.gMapsCalls=0;C.apifyRuns=0;C.lastUsageDate=t;sc();}
  var hu=document.getElementById('headerUsage');if(!hu)return;

  // Base: always show Google calls
  var parts=[];
  parts.push('<span>&#127760; Google: <strong style="color:#7eb8f7">'+(C.gMapsCalls||0)+'</strong> calls today</span>');

  hu.innerHTML=parts.join('<span style="opacity:.3"> | </span>');
  if(false&&C.apifyToken&&C.workerUrl){ // Apify removed
    parts.push('<span id="huApify" style="color:#a09888">Apify: loading...</span>');
    hu.innerHTML=parts.join('<span style="opacity:.3">|</span>');
    try{
      var d=await pxGet({mode:'apify_account',token:C.apifyToken});
      var apifyHtml='';
      if(d&&d.data&&d.data.monthlyUsageUsd!==undefined){
        var used=d.data.monthlyUsageUsd;
        var limit=5; // free tier default, rough estimate
        var pct=Math.min(100,(used/limit)*100);
        var warn=pct>=80;
        var color=warn?'#f5a623':pct>=60?'#e0c040':'#7eb8f7';
        apifyHtml='<span style="color:'+color+'">Apify: $'+used.toFixed(3)+'/mo'+(warn?' &#9888;':'')+'</span>';
      } else {
        apifyHtml='<span style="color:#a09888">Apify: connected</span>';
      }
      var el=document.getElementById('huApify');if(el)el.outerHTML=apifyHtml;
    }catch(e){
      var el=document.getElementById('huApify');if(el)el.outerHTML='<span style="color:var(--accent)">Apify: error</span>';
    }
  } else if(C.apifyToken){
    parts.push('<span style="color:#a09888">Apify: set Worker URL</span>');
    hu.innerHTML=parts.join('<span style="opacity:.3">|</span>');
  } else {
    hu.innerHTML=parts.join('<span style="opacity:.3">|</span>');
  }
}

var currentRadius=50;
function onRadiusChange(v){currentRadius=parseInt(v);document.getElementById('radiusVal').textContent=currentRadius+' mi';applyFilter();}

var gmap,gmarkers=[],mapsOk=false,originAddr='',originCoords=null,cardPins={},cardRoutes={};

function initGMaps(){
  if(mapsOk||!C.mapsKey)return;
  if(typeof google!=='undefined'&&google.maps){mapsOk=true;return;}
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(C.mapsKey)+'&libraries=geometry&loading=async&callback=onMR';
  s.async=true;document.body.appendChild(s);
}
window.onMR=function(){mapsOk=true;};

function setupMap(lat,lng){
  var c=document.getElementById('mapContainer');c.style.display='block';
  gmap=new google.maps.Map(c,{center:{lat:lat,lng:lng},zoom:11,
    styles:[{featureType:'poi',stylers:[{visibility:'off'}]},{featureType:'transit',stylers:[{visibility:'simplified'}]}]});
  gmarkers.forEach(function(m){m.setMap(null);});gmarkers=[];
  Object.keys(cardRoutes).forEach(function(k){if(cardRoutes[k])cardRoutes[k].setMap(null);});
  cardPins={};cardRoutes={};
  var om=new google.maps.Marker({position:{lat:lat,lng:lng},map:gmap,
    icon:{url:'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'},title:'Your location'});
  gmarkers.push(om);
}

var ROUTE_COLORS=['#c0452a','#2963c8','#1a7a3a','#b06a00','#7b2d8b','#0097a7','#e65100','#37474f'];

async function togglePin(gid){
  var r=findResultByGlobalId(gid);if(!r||!gmap)return;
  var cb=document.getElementById('mc_'+gid);if(!cb)return;
  if(cb.checked){
    var lat=r.lat,lng=r.lng;
    if(!lat&&r.address){try{var d=await pxGet({mode:'geocode',address:r.address,key:C.mapsKey});if(d.results&&d.results.length){lat=d.results[0].geometry.location.lat;lng=d.results[0].geometry.location.lng;r.lat=lat;r.lng=lng;}}catch(e){}}
    if(!lat||!lng){cb.checked=false;alert('Could not locate this business.');return;}
    var color=ROUTE_COLORS[Object.keys(cardPins).length%ROUTE_COLORS.length];
    var m=new google.maps.Marker({
      position:{lat:lat,lng:lng},map:gmap,title:r.name,
      label:{text:String(Object.keys(cardPins).length+1),color:'#fff',fontSize:'11px',fontWeight:'600'},
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:14,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
    });
    cardPins[gid]=m;gmarkers.push(m);
    if(originCoords){
      try{
        var routeResp=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{
          method:'POST',
          headers:{'Content-Type':'application/json','X-Goog-Api-Key':C.mapsKey,'X-Goog-FieldMask':'routes.polyline.encodedPolyline'},
          body:JSON.stringify({origin:{location:{latLng:{latitude:originCoords.lat,longitude:originCoords.lng}}},destination:{location:{latLng:{latitude:lat,longitude:lng}}},travelMode:'DRIVE',routingPreference:'TRAFFIC_AWARE'})
        });
        var routeData=await routeResp.json();
        if(routeData.routes&&routeData.routes[0]&&routeData.routes[0].polyline){
          var poly=new google.maps.Polyline({path:google.maps.geometry.encoding.decodePath(routeData.routes[0].polyline.encodedPolyline),map:gmap,strokeColor:color,strokeWeight:4,strokeOpacity:0.75});
          cardRoutes[gid]=poly;
        }
      }catch(e){console.warn('Route draw failed:',e);}
    }
    var b=new google.maps.LatLngBounds();gmarkers.forEach(function(mk){b.extend(mk.getPosition());});gmap.fitBounds(b);if(gmarkers.length<=2)gmap.setZoom(13);
  } else {
    if(cardPins[gid]){cardPins[gid].setMap(null);var mi=gmarkers.indexOf(cardPins[gid]);if(mi>-1)gmarkers.splice(mi,1);delete cardPins[gid];}
    if(cardRoutes[gid]){cardRoutes[gid].setMap(null);delete cardRoutes[gid];}
  }
}

function findResultByGlobalId(gid){for(var src in sourceResults){if(src.indexOf('__')>-1||src.indexOf('_error')>-1)continue;var arr=sourceResults[src]||[];for(var i=0;i<arr.length;i++){if(arr[i]._gid===gid)return arr[i];}}return null;}

async function pxGet(params){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  var r=await fetch(C.workerUrl+'?'+qs);
  if(!r.ok)throw new Error('Proxy '+r.status);
  if(params.mode&&params.mode.indexOf('apify')!==0)bumpGoogle(1);
  return r.json();
}
async function pxPost(params,body){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  var r=await fetch(C.workerUrl+'?'+qs,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(!r.ok){var t=await r.text();throw new Error('Proxy '+r.status+': '+t.substring(0,200));}
  if(params.mode==='apify_run')bumpApify(1);
  return r.json();
}

async function searchPlacesGoogle(query,lat,lng){
  var results=[];
  var d=await pxGet({mode:'places_search',q:query,key:C.mapsKey,lat:lat,lng:lng,radius:50000});
  if(d.results)results=results.concat(d.results);
  if(d.next_page_token){await sleep(2000);try{var d2=await pxGet({mode:'places_search',q:query,key:C.mapsKey,pagetoken:d.next_page_token});if(d2.results)results=results.concat(d2.results);}catch(e){}}
  return results.map(function(p){
    var loc=p.geometry&&p.geometry.location;
    return{_src:'google',name:p.name||'Unknown',placeId:p.place_id||null,
      address:p.formatted_address||p.vicinity||null,
      rating:p.rating?parseFloat(p.rating):null,reviews:p.user_ratings_total||0,
      price:p.price_level?'$'.repeat(p.price_level):null,phone:null,website:null,
      lat:loc?loc.lat:null,lng:loc?loc.lng:null,
      desc:p.types?p.types.filter(function(t){return t!=='establishment'&&t!=='point_of_interest';}).slice(0,2).map(function(t){return t.replace(/_/g,' ');}).join(', '):'',
      driveMin:null,driveTxt:null,distTxt:null,distMiles:null,
      open:p.opening_hours?p.opening_hours.open_now:null};
  });
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function geocodeAddr(addr){try{var d=await pxGet({mode:'geocode',address:addr,key:C.mapsKey});if(d.results&&d.results.length)return d.results[0].geometry.location;}catch(e){console.error('Geocode error:',e);}return null;}

async function getDriveTimes(origin,addrs){
  if(!addrs.length)return[];
  var out=[];
  for(var i=0;i<addrs.length;i+=25){
    var batch=addrs.slice(i,i+25);
    try{
      var d=await pxGet({mode:'distance',origins:origin,destinations:batch.join('|'),key:C.mapsKey});
      if(d.rows&&d.rows[0]&&d.rows[0].elements){
        d.rows[0].elements.forEach(function(el){
          if(el.status==='OK'){var distM=el.distance.value/1609.34;out.push({driveMin:Math.round(el.duration.value/60),driveTxt:el.duration.text,distTxt:el.distance.text,distMiles:distM});}
          else out.push({driveMin:null,driveTxt:null,distTxt:null,distMiles:null});
        });
      } else batch.forEach(function(){out.push({driveMin:null,driveTxt:null,distTxt:null,distMiles:null});});
    }catch(e){batch.forEach(function(){out.push({driveMin:null,driveTxt:null,distTxt:null,distMiles:null});});}
  }
  return out;
}

function extractCity(addr){var p=addr.trim().split(',');if(p.length>=2)return p.slice(-2).join(',').trim();return addr.trim();}

function guessCraigslistCity(city){
  var c=city.toLowerCase();
  if(c.indexOf('chicago')>-1)return'chicago';
  if(c.indexOf('new york')>-1||c.indexOf('nyc')>-1||/\bny\b/.test(c))return'newyork';
  if(c.indexOf('los angeles')>-1||/\bla\b/.test(c))return'losangeles';
  if(c.indexOf('san francisco')>-1||c.indexOf('sf')>-1||c.indexOf('bay area')>-1)return'sfbay';
  if(c.indexOf('michigan')>-1||/\bmi\b/.test(c))return'swmi';
  if(c.indexOf('seattle')>-1)return'seattle';
  if(c.indexOf('boston')>-1)return'boston';
  if(c.indexOf('miami')>-1)return'miami';
  if(c.indexOf('dallas')>-1)return'dallas';
  if(c.indexOf('houston')>-1)return'houston';
  if(c.indexOf('atlanta')>-1)return'atlanta';
  if(c.indexOf('denver')>-1)return'denver';
  if(c.indexOf('phoenix')>-1)return'phoenix';
  if(c.indexOf('portland')>-1)return'portland';
  return'sfbay';
}

function buildApifyInput(srcKey,svc,addr){
  var city=extractCity(addr);
  if(srcKey==='taskrabbit'){
    return{startUrls:[{url:'https://www.taskrabbit.com/search#?utf8=%E2%9C%93&q='+encodeURIComponent(svc)+'&location='+encodeURIComponent(city)}],maxItems:25};
  }
  if(srcKey==='thumbtack'){
    var zip=(city.match(/\d{5}/)||[''])[0]||city;
    return{startUrls:[{url:'https://www.thumbtack.com/search/?q='+encodeURIComponent(svc)+'&requestPostalCode='+encodeURIComponent(zip)}],maxItems:25};
  }
  if(srcKey==='craigslist'){
    var clCity=guessCraigslistCity(city);
    return{startUrls:[{url:'https://'+clCity+'.craigslist.org/search/bbb?query='+encodeURIComponent(svc)}],maxItems:25,proxy:{useApifyProxy:true}};
  }
  return{};
}

async function runApifyActor(srcKey,svc,addr){
  var src=SOURCES[srcKey];if(!src||src.kind!=='apify')return[];
  var input=buildApifyInput(srcKey,svc,addr);
  console.log('[Apify]',srcKey,'input:',input);
  var data;
  try{data=await pxPost({mode:'apify_run',actor_id:src.actor,token:C.apifyToken,timeout:'90'},input);}
  catch(e){console.error('Apify run failed for '+srcKey+':',e);throw e;}
  console.log('[Apify]',srcKey,'response:',data);
  if(!Array.isArray(data)){if(data&&data.error)throw new Error(data.error);return[];}
  return data.map(function(item){return normalizeApifyItem(srcKey,item);}).filter(Boolean);
}

function normalizeApifyItem(srcKey,item){
  if(!item||typeof item!=='object')return null;
  var out={
    _src:srcKey,
    name:item.name||item.title||item.taskerName||item.businessName||'Untitled',
    address:item.address||item.location||item.serviceArea||null,
    rating:null,reviews:0,price:null,phone:null,website:item.url||item.link||null,
    lat:item.latitude||item.lat||null,lng:item.longitude||item.lng||null,
    desc:item.description||item.snippet||item.bio||item.summary||'',
    driveMin:null,driveTxt:null,distTxt:null,distMiles:null,open:null
  };
  if(item.rating){var rt=parseFloat(item.rating);if(!isNaN(rt))out.rating=rt;}
  if(item.reviewsCount||item.reviewCount||item.numReviews)out.reviews=parseInt(item.reviewsCount||item.reviewCount||item.numReviews)||0;
  if(item.price||item.hourlyRate||item.priceRange)out.price=String(item.price||item.hourlyRate||item.priceRange);
  if(item.phone||item.phoneNumber)out.phone=item.phone||item.phoneNumber;
  return out;
}

var sourceResults={};
var globalIdCounter=0;

function applyFilter(){
  var by=document.getElementById('liveFilter').value;
  var radiusMiles=currentRadius;
  Object.keys(sourceResults).forEach(function(srcKey){
    if(srcKey.indexOf('__')>-1||srcKey.indexOf('_error')>-1)return;
    var arr=sourceResults[srcKey]||[];
    var meets=[],others=[];
    arr.forEach(function(r){
      if(r._redirect){meets.push(r);return;}
      var pr=r.rating!==null&&r.rating>=C.minRating;
      var pv=r.reviews>=C.minReviews;
      var pd=r.driveMin===null||r.driveMin<=C.maxDrive;
      var inR=r.distMiles===null||r.distMiles===undefined||r.distMiles<=radiusMiles;
      if(pr&&pv&&pd&&inR)meets.push(r);else others.push(r);
    });
    sourceResults[srcKey+'__meets']=sortArr(meets,by);
    sourceResults[srcKey+'__others']=sortArr(others,by);
  });
  renderAllSections();updateResultsCount();
  Object.keys(cardPins).forEach(function(gid){var still=findResultByGlobalId(gid);if(!still){cardPins[gid].setMap(null);delete cardPins[gid];if(cardRoutes[gid]){cardRoutes[gid].setMap(null);delete cardRoutes[gid];}}});
}

function sortArr(arr,by){
  return arr.slice().sort(function(a,b){
    if(by==='rating')return(b.rating||0)-(a.rating||0);
    if(by==='reviews')return(b.reviews||0)-(a.reviews||0);
    if(by==='distance'){var da=a.distMiles!==null&&a.distMiles!==undefined?a.distMiles:9999;var db=b.distMiles!==null&&b.distMiles!==undefined?b.distMiles:9999;return da-db;}
    return 0;
  });
}

function updateResultsCount(){
  var cnt=document.getElementById('resultsCount');
  var total=0,meetsTotal=0;
  Object.keys(sourceResults).forEach(function(k){
    if(k.indexOf('__')>-1||k.indexOf('_error')>-1)return;
    total+=sourceResults[k].length;meetsTotal+=(sourceResults[k+'__meets']||[]).length;
  });
  var sel=document.getElementById('service');
  var svcLabel=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'';
  cnt.innerHTML='<span>'+total+'</span> total \u2014 '+esc(svcLabel)+' <span style="font-size:.85rem;font-weight:400;color:var(--muted)">('+meetsTotal+' meet requirements within '+currentRadius+' mi)</span>';
}

async function doSearch(){
  var address=document.getElementById('address').value.trim(),service=document.getElementById('service').value;
  var st=document.getElementById('statusText'),sp=document.getElementById('spinner'),btn=document.getElementById('searchBtn'),
    em=document.getElementById('errorMsg'),nk=document.getElementById('noKeyMsg'),
    rw=document.getElementById('resultsWrap'),grid=document.getElementById('resultsGrid');
  nk.classList.remove('show');em.classList.remove('show');
  if(!address){st.textContent='Enter an address.';return;}
  if(!service){st.textContent='Select a service.';return;}
  if(!C.selectedSources.length){st.textContent='Pick at least one source.';return;}

  var svcLabel=document.getElementById('service').options[document.getElementById('service').selectedIndex].text;
  originAddr=address;originCoords=null;cardPins={};sourceResults={};globalIdCounter=0;

  var needsGoogle=C.selectedSources.indexOf('google')>-1;
  var needsApify=C.selectedSources.some(function(k){return SOURCES[k]&&SOURCES[k].kind==='apify';});
  var needsCraigslist=C.selectedSources.indexOf('craigslist')>-1;
  if((needsGoogle||needsApify)&&!C.workerUrl){nk.classList.add('show');return;}
  if(needsGoogle&&!C.mapsKey){nk.classList.add('show');return;}
  if(needsApify&&!C.apifyToken){em.textContent='Apify token required. Add it in Settings.';em.classList.add('show');return;}

  btn.disabled=true;sp.classList.add('active');rw.classList.remove('visible');grid.innerHTML='';
  document.getElementById('mapContainer').style.display='none';

  if(C.mapsKey&&C.workerUrl){st.textContent='Locating your address...';originCoords=await geocodeAddr(address);}
  rw.classList.add('visible');

  st.textContent='Searching '+C.selectedSources.length+' source'+(C.selectedSources.length>1?'s':'')+'...';
  var promises=C.selectedSources.map(function(srcKey){return runSource(srcKey,svcLabel,address);});
  await Promise.all(promises);

  if(needsGoogle&&originCoords&&mapsOk)setupMap(originCoords.lat,originCoords.lng);
  else if(C.mapsKey&&!mapsOk)initGMaps();

  applyFilter();
  btn.disabled=false;sp.classList.remove('active');st.textContent='Done.';
  refreshUsage();

  if(sourceResults.google&&sourceResults.google.length){
    fetchPhonesBackground(sourceResults.google,function(){applyFilter();});
  }
}

async function runSource(srcKey,svc,addr){
  var src=SOURCES[srcKey];if(!src){sourceResults[srcKey]=[];return;}

  if(src.kind==='google'){
    if(!originCoords){sourceResults.google=[];return;}
    try{
      var all=await searchPlacesGoogle(svc,originCoords.lat,originCoords.lng);
      all=dedup(all);
      if(all.length){
        var addrs=all.map(function(r){return r.address||r.name;});
        var times=await getDriveTimes(addr,addrs);
        times.forEach(function(t,i){if(i<all.length){all[i].driveMin=t.driveMin;all[i].driveTxt=t.driveTxt;all[i].distTxt=t.distTxt;all[i].distMiles=t.distMiles;}});
      }
      all.forEach(function(r){r._gid='g'+(globalIdCounter++);});
      sourceResults.google=all;
    }catch(e){console.error('Google search failed:',e);sourceResults.google=[];sourceResults.google_error=e.message;}
    return;
  }

  if(src.kind==='apify'){
    try{
      var arr=await runApifyActor(srcKey,svc,addr);
      if(arr.length&&originCoords&&C.mapsKey){
        var hasAddr=arr.filter(function(r){return r.address;});
        if(hasAddr.length){
          var times=await getDriveTimes(addr,hasAddr.map(function(r){return r.address;}));
          hasAddr.forEach(function(r,i){if(times[i]){r.driveMin=times[i].driveMin;r.driveTxt=times[i].driveTxt;r.distTxt=times[i].distTxt;r.distMiles=times[i].distMiles;}});
        }
      }
      arr.forEach(function(r){r._gid=srcKey[0]+(globalIdCounter++);});
      sourceResults[srcKey]=arr;
    }catch(e){console.error(srcKey+' failed:',e);sourceResults[srcKey]=[];sourceResults[srcKey+'_error']=e.message;}
    return;
  }

  if(src.kind==='craigslist'){
    try{
      var clCity=guessCraigslistCity(extractCity(addr));
      var d=await pxGet({mode:'craigslist',q:svc,city:clCity,max:25});
      if(d.error)throw new Error(d.error);
      var arr=(d.results||[]).map(function(item){
        return{
          _src:'craigslist',
          name:item.name||item.title||'Untitled',
          address:item.location||null,
          rating:null,reviews:0,
          price:item.price||null,
          phone:null,
          website:item.url||item.link||null,
          lat:null,lng:null,
          desc:item.description||'',
          driveMin:null,driveTxt:null,distTxt:null,distMiles:null,open:null
        };
      });
      arr.forEach(function(r){r._gid='c'+(globalIdCounter++);});
      sourceResults.craigslist=arr;
      if(!arr.length)sourceResults.craigslist_error='No listings found on Craigslist for "'+svc+'" in '+clCity;
    }catch(e){console.error('Craigslist failed:',e);sourceResults.craigslist=[];sourceResults.craigslist_error=e.message;}
    return;
  }

  if(src.kind==='redirect'){
    var city=extractCity(addr);
    sourceResults[srcKey]=[{_src:srcKey,_gid:srcKey[0]+(globalIdCounter++),_redirect:true,name:src.name+' search',website:src.urlFn(svc,city),address:null,rating:null,reviews:0,phone:null,desc:'Opens '+src.name+' in a new tab — results not scraped directly.',driveMin:null,driveTxt:null,distTxt:null,distMiles:null,open:null}];
    return;
  }
}

function dedup(arr){var s={};return arr.filter(function(x){var k=x.placeId||x.name.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,25);if(s[k])return false;s[k]=true;return true;});}

function renderAllSections(){
  var html='';
  C.selectedSources.forEach(function(srcKey){
    var src=SOURCES[srcKey];if(!src)return;
    var meets=sourceResults[srcKey+'__meets']||[];
    var others=sourceResults[srcKey+'__others']||[];
    var raw=sourceResults[srcKey]||[];
    var err=sourceResults[srcKey+'_error'];
    html+='<div class="source-section">';
    html+='<div class="source-header">'
      +'<div class="source-title"><span class="source-badge" style="background:'+src.color+'">'+esc(src.name)+'</span><span>'+raw.length+' result'+(raw.length===1?'':'s')+'</span></div>'
      +'<div class="source-meta">'+meets.length+' meet requirements</div>'
      +'</div>';
    if(err){
      html+='<div style="background:#fff3f0;border:1px solid #f0c8c0;border-radius:10px;padding:.7rem;font-size:.83rem;color:var(--accent)">Error: '+esc(err)+'</div>';
    } else if(!raw.length){
      html+='<div style="padding:1rem;text-align:center;color:var(--muted);font-size:.85rem">No results.</div>';
    } else {
      if(meets.length){html+='<div class="section-heading">&#10003; Meets Requirements ('+meets.length+')</div><div class="cards-grid">';html+=meets.map(function(r,i){return renderCard(r,i+1,false);}).join('');html+='</div>';}
      if(others.length){html+='<div class="section-heading other-heading">&#128203; Other Results ('+others.length+')</div><div class="cards-grid">';html+=others.map(function(r,i){return renderCard(r,meets.length+i+1,true);}).join('');html+='</div>';}
    }
    html+='</div>';
  });
  document.getElementById('resultsGrid').innerHTML=html;
}

function starsH(r){if(!r)return'';var n=parseFloat(r),f=Math.floor(n),h=n%1>=.5?1:0;return'\u2605'.repeat(f)+(h?'\u00BD':'')+'\u2606'.repeat(5-f-h);}

function renderCard(r,idx,dimmed){
  var delay=(idx%10*25)+'ms',cls='result-card'+(dimmed?' dimmed':'');
  if(r._redirect){
    return '<div class="'+cls+'" style="animation-delay:'+delay+'">'
      +'<div class="card-top"><div class="card-name">'+esc(r.name)+'</div></div>'
      +'<div class="card-desc">'+esc(r.desc)+'</div>'
      +'<div class="card-actions"><a class="btn-a primary" href="'+esc(r.website)+'" target="_blank" rel="noopener">&#127760; Open</a></div>'
      +'</div>';
  }
  var rh=r.rating
    ?'<span class="stars">'+starsH(r.rating)+'</span><strong>'+r.rating.toFixed(1)+'</strong> <span class="rv-link" onclick="openReviews(\''+r._gid+'\')">('+r.reviews.toLocaleString()+')</span>'
    :'<span style="color:var(--muted)">No rating yet</span>';
  var pills='<span class="pill pill-local">'+esc(SOURCES[r._src]?SOURCES[r._src].name:r._src)+'</span>';
  if(r.driveTxt)pills+='<span class="pill pill-drive">\uD83D\uDE97 '+esc(r.driveTxt)+'</span>';
  if(r.distTxt)pills+='<span class="pill pill-neutral">'+esc(r.distTxt)+'</span>';
  if(r.price)pills+='<span class="pill pill-neutral">'+esc(r.price)+'</span>';
  if(r.open===true)pills+='<span class="pill pill-open">Open now</span>';
  else if(r.open===false)pills+='<span class="pill pill-closed">Closed</span>';
  var acts='';
  var phones=r.phones&&r.phones.length?r.phones:(r.phone?[r.phone]:[]);
  phones.forEach(function(ph){acts+='<button class="btn-a primary" onclick="copyPhone(\''+ph.replace(/'/g,'')+'\',this)" title="Click to copy">&#128222; '+esc(ph)+'</button>';});
  if(r.website)acts+='<a class="btn-a" href="'+esc(r.website)+'" target="_blank">&#127760; Site</a>';
  if(r.address&&r._src==='google')acts+='<a class="btn-a" href="https://maps.google.com/maps/dir/?api=1&origin='+encodeURIComponent(originAddr)+'&destination='+encodeURIComponent(r.address)+'" target="_blank">&#128205; Directions</a>';
  var chk=(r._src==='google'||r.lat)?'<label class="map-check"><input type="checkbox" id="mc_'+r._gid+'" onchange="togglePin(\''+r._gid+'\')"/> Show on map</label>':'';
  return '<div class="'+cls+'" style="animation-delay:'+delay+'">'
    +'<div class="card-top"><div class="card-name">'+esc(r.name)+'</div><div class="badge-num">'+idx+'</div></div>'
    +(r.desc?'<div class="card-desc">'+esc(r.desc)+'</div>':'')
    +'<div class="card-meta">'+pills+'</div>'
    +'<div class="rating-line">'+rh+'</div>'
    +(acts?'<div class="card-actions">'+acts+'</div>':'')
    +chk+'</div>';
}

async function fetchPhonesBackground(results,onDone){
  var limit=Math.min(results.length,30);
  for(var i=0;i<limit;i++){
    var r=results[i];if(r.phone)continue;
    try{
      var pid=r.placeId;
      if(!pid){var fRes=await pxGet({mode:'places_find',q:r.name+(r.address?' '+r.address:''),key:C.mapsKey});if(fRes.candidates&&fRes.candidates.length){pid=fRes.candidates[0].place_id;r.placeId=pid;}}
      if(!pid)continue;
      var det=await pxGet({mode:'places_details',place_id:pid,key:C.mapsKey});
      var res=det.result;
      if(res&&res.formatted_phone_number){r.phone=res.formatted_phone_number;r.phones=[r.phone];applyFilter();}
      if(res&&res.website&&!r.website)r.website=res.website;
    }catch(e){}
  }
  if(onDone)onDone();
}

async function openReviews(gid){
  var r=findResultByGlobalId(gid);if(!r)return;
  document.getElementById('rvTitle').textContent=r.name;
  document.getElementById('rvSummary').textContent='';
  document.getElementById('rvBody').innerHTML='<div class="rv-loading">&#8987; Loading reviews...</div>';
  document.getElementById('rvOverlay').classList.add('open');
  if(r._src!=='google'){
    document.getElementById('rvBody').innerHTML='<div class="rv-none">Reviews are only available for Google results.'+(r.website?'<br><br><a href="'+esc(r.website)+'" target="_blank" style="color:var(--accent2)">Visit listing</a>':'')+'</div>';
    return;
  }
  try{
    var pid=r.placeId;
    if(!pid){var fRes=await pxGet({mode:'places_find',q:r.name+(r.address?' '+r.address:''),key:C.mapsKey});if(fRes.candidates&&fRes.candidates.length)pid=fRes.candidates[0].place_id;}
    if(!pid){showNoReviews(r);return;}
    var det=await pxGet({mode:'places_details',place_id:pid,key:C.mapsKey});
    var res=det.result;if(!res){showNoReviews(r);return;}
    if(res.formatted_phone_number&&!r.phone){r.phone=res.formatted_phone_number;r.phones=[r.phone];}
    if(res.website&&!r.website)r.website=res.website;
    var rvs=res.reviews||[];
    if(!rvs.length){showNoReviews(r);return;}
    document.getElementById('rvSummary').textContent=(res.rating?'\u2605 '+res.rating+' overall':'')+(res.user_ratings_total?' \u00b7 '+res.user_ratings_total.toLocaleString()+' total reviews':'');
    document.getElementById('rvBody').innerHTML=rvs.map(function(rv){
      return'<div class="rv-item"><div class="rv-author">'+esc(rv.author_name||'Anonymous')+'</div><div class="rv-date">'+esc(rv.relative_time_description||'')+'</div>'+(rv.rating?'<div class="rv-stars">'+starsH(rv.rating)+' '+rv.rating+'</div>':'')+'<div class="rv-text">'+esc(rv.text||'No written review')+'</div></div>';
    }).join('');
  }catch(e){document.getElementById('rvBody').innerHTML='<div class="rv-none">Error: '+esc(e.message)+'</div>';}
}
function showNoReviews(r){document.getElementById('rvBody').innerHTML='<div class="rv-none">No Google reviews found.'+(r.website?'<br><br><a href="'+esc(r.website)+'" target="_blank" style="color:var(--accent2)">Visit their website</a>':'')+'</div>';}
function closeReviews(){document.getElementById('rvOverlay').classList.remove('open');}
function copyPhone(ph,btn){navigator.clipboard.writeText(ph).then(function(){var orig=btn.innerHTML;btn.innerHTML='&#10003; Copied!';setTimeout(function(){btn.innerHTML=orig;},1500);}).catch(function(){alert('Copy failed. Number: '+ph);});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

popSvc();updateFI();initGMaps();renderSourceCheckboxes();refreshUsage();
</script>
